name: Deploy Landing Pages to HubSpot

on:
  push:
    branches:
      - dev
      - stage
      - main
    paths:
      - 'pages/**'
      - 'scripts/**'
      - '.github/workflows/push-to-hubspot.yml'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Dev Branch -> Sync to HubSpot Design Manager Only
  # (No CMS page creation — templates only for preview)
  # ----------------------------------------------------
  deploy-dev-design-manager:
    name: Sync to HubSpot Design Manager (dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync HTML Files to HubSpot Design Manager (Dev Folder)
        uses: HubSpot/hubspot-cms-deploy-action@v2.0.1
        with:
          src_dir: 'pages'
          dest_dir: 'landing-pages/design-manager'
          account_id: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          personal_access_key: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}

      - name: Log Design Manager Sync Result
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          ENVIRONMENT: dev
        run: node scripts/deploy-hubspot.js

  # ----------------------------------------------------
  # Stage Branch -> Deploy to HubSpot Content Staging
  # (Syncs templates + creates/updates DRAFT pages)
  # ----------------------------------------------------
  deploy-stage-content-staging:
    name: Deploy to HubSpot Content Staging (stage)
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync HTML Files to HubSpot Design Manager (Staging Folder)
        uses: HubSpot/hubspot-cms-deploy-action@v2.0.1
        with:
          src_dir: 'pages'
          dest_dir: 'landing-pages/content-staging'
          account_id: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          personal_access_key: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}

      - name: Create/Update Landing Pages in HubSpot Content Staging
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          ENVIRONMENT: staging
        run: node scripts/deploy-hubspot.js

  # ----------------------------------------------------
  # Main Branch -> Deploy to HubSpot Production Landing Pages
  # (Syncs templates + creates/updates and PUBLISHES pages live)
  # ----------------------------------------------------
  deploy-main-production:
    name: Deploy to HubSpot Live Landing Pages (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync HTML Files to HubSpot Design Manager (Production Folder)
        uses: HubSpot/hubspot-cms-deploy-action@v2.0.1
        with:
          src_dir: 'pages'
          dest_dir: 'landing-pages/production'
          account_id: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          personal_access_key: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}

      - name: Publish Landing Pages Live to HubSpot Production
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          ENVIRONMENT: production
        run: node scripts/deploy-hubspot.js
